<script>
  (function renderPlayerDirectory() {
    const directory = document.getElementById('playerDirectory');
    if (!directory) return;
    let players = [];
    try { players = JSON.parse(localStorage.getItem('domaPlayers') || '[]'); } catch (error) { players = []; }
    if (!Array.isArray(players) || !players.length) {
      const emptyState = document.createElement('p');
      emptyState.className = 'col-span-full rounded-xl border border-dashed border-[#cbdcf0] bg-white px-5 py-16 text-center text-sm text-[#7d96b8]';
      emptyState.textContent = 'No player profiles have been added yet.';
      directory.appendChild(emptyState);
      return;
    }
    const positionLabels = {
      Goalkeeper: 'GK',
      Defender: 'DEF',
      Midfielder: 'MID',
      Forward: 'FWD'
    };

    const createText = (tag, className, text) => {
      const element = document.createElement(tag);
      element.className = className;
      element.textContent = text || '';
      return element;
    };

    const createCard = (player) => {
      const card = document.createElement('article');
      card.className = 'overflow-hidden rounded-xl border border-[#dbe7f7] bg-white shadow-[0_12px_32px_rgba(24,70,130,.07)] transition duration-200 hover:-translate-y-1 hover:border-[#aac8f3] hover:shadow-[0_20px_42px_rgba(24,70,130,.15)]';

      const photo = document.createElement('div');
      photo.className = 'grid h-[320px] place-items-center overflow-hidden bg-gradient-to-br from-[#0a2550] via-[#1850a4] to-[#4e8cf0] text-2xl font-black tracking-[2px] text-white';
      if (player.photo) {
        const image = document.createElement('img');
        image.src = player.photo;
        image.alt = player.playerName ? `${player.playerName} photo` : 'Player photo';
        image.className = 'h-full w-full object-cover';
        image.addEventListener('error', () => { photo.replaceChildren(); photo.textContent = 'PLAYER'; });
        photo.appendChild(image);
      } else {
        photo.textContent = 'PLAYER';
      }

      const details = document.createElement('div');
      details.className = 'p-6';
      const header = document.createElement('div');
      header.className = 'flex items-start justify-between gap-4';
      header.append(
        createText('div', 'text-[11px] font-extrabold uppercase tracking-[1.5px] text-[#2161c7]', positionLabels[player.position] || player.position || 'PLAYER'),
        createText('span', 'shrink-0 rounded-full bg-[#e6f0ff] px-3 py-1 text-[10px] font-black uppercase tracking-[.5px] text-[#2161c7]', player.status || 'Active')
      );
      details.append(
        header,
        createText('h2', 'mt-3 text-2xl font-black text-[#10284b]', player.playerName || 'Player Name'),
        createText('p', 'mt-2 text-sm font-bold text-[#6d83a2]', `Squad number #${player.number || '--'} · ${player.position || 'Position not set'}`)
      );
      card.append(photo, details);
      return card;
    };
    directory.replaceChildren(...players.map(createCard));
  }());
</script>
